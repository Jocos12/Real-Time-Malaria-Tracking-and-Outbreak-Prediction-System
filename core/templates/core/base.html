<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Malaria Tracking System{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
    :root {
        --danger: #dc2626; --danger-light: #fef2f2; --danger-border: #fecaca;
        --safe: #059669; --safe-light: #ecfdf5; --safe-border: #a7f3d0;
        --warning: #d97706; --warning-light: #fffbeb;
        --primary: #0f172a; --primary-2: #1e293b;
        --accent: #0891b2; --accent-2: #06b6d4; --violet: #7c3aed;
        --bg: #f4f6f9; --card: #ffffff; --border: #e2e8f0;
        --text: #0f172a; --text-muted: #64748b; --text-faint: #94a3b8;
        --header-bg: #ffffff;
        --radius: 16px; --sidebar-w: 260px; --header-h: 64px;
        --shadow-sm: 0 1px 2px rgba(15,23,42,0.04), 0 1px 3px rgba(15,23,42,0.03);
        --shadow-md: 0 4px 14px rgba(15,23,42,0.06);
        --shadow-lg: 0 12px 32px rgba(15,23,42,0.10);
    }
    html[data-theme="dark"] {
        --bg: #0b1120; --card: #111a2e; --border: #1e293b;
        --text: #e5e9f0; --text-muted: #94a3b8; --text-faint: #64748b;
        --header-bg: #111a2e;
        --danger-light: #2a1315; --safe-light: #0d211a;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
        --shadow-md: 0 4px 14px rgba(0,0,0,0.35);
        --shadow-lg: 0 12px 32px rgba(0,0,0,0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg); color: var(--text);
        -webkit-font-smoothing: antialiased;
        transition: background 0.25s ease, color 0.25s ease;
    }
    .icon { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.15em; flex-shrink: 0; }

    /* ============ SIDEBAR ============ */
    aside.sidebar {
        position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w);
        background: linear-gradient(180deg, #0b1224 0%, #0f2942 60%, #0b1a2e 100%);
        color: white; display: flex; flex-direction: column; z-index: 60;
        box-shadow: 4px 0 24px rgba(8,17,32,0.25);
    }
    .brand { display: flex; align-items: center; gap: 0.85rem; padding: 1.4rem 1.4rem 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.08); height: var(--header-h); }
    .brand-mark {
        width: 40px; height: 40px; border-radius: 12px;
        background: linear-gradient(135deg, #06b6d4, #0891b2 60%, #0e7490);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 12px rgba(6,182,212,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
        flex-shrink: 0; animation: floatY 4s ease-in-out infinite;
    }
    @keyframes floatY { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-3px);} }
    .brand-text { font-size: 0.98rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
    .brand-text small { display: block; font-weight: 500; font-size: 0.68rem; color: rgba(255,255,255,0.5); margin-top: 2px; }

    nav.side-nav { flex: 1; padding: 1.1rem 0.9rem; display: flex; flex-direction: column; gap: 0.3rem; }
    .nav-section-label { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; color: rgba(255,255,255,0.35); text-transform: uppercase; padding: 0.9rem 0.7rem 0.4rem; }
    nav.side-nav a {
        color: rgba(255,255,255,0.72); text-decoration: none; padding: 0.7rem 0.9rem; border-radius: 10px;
        font-size: 0.87rem; font-weight: 600; display: flex; align-items: center; gap: 0.75rem;
        transition: color 0.2s ease, background 0.25s ease, transform 0.15s ease;
    }
    nav.side-nav a svg { width: 17px; height: 17px; flex-shrink: 0; }
    nav.side-nav a:hover { color: #fff; background: rgba(255,255,255,0.07); transform: translateX(2px); }
    nav.side-nav a.active { background: linear-gradient(135deg, #06b6d4, #0891b2); color: white; box-shadow: 0 3px 12px rgba(6,182,212,0.4); }

    .sidebar-status { padding: 1rem 1.3rem 1.4rem; border-top: 1px solid rgba(255,255,255,0.08); font-size: 0.71rem; color: rgba(255,255,255,0.45); }
    .status-row { display: flex; align-items: center; justify-content: space-between; padding: 0.3rem 0; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,0.5); animation: livePulse 1.8s infinite; margin-right: 6px; }
    @keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.55);} 70% { box-shadow: 0 0 0 6px rgba(34,197,94,0);} 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0);} }

    /* ============ HEADER ============ */
    header.topbar {
        position: fixed; top: 0; left: var(--sidebar-w); right: 0; height: var(--header-h);
        background: var(--header-bg); border-bottom: 1px solid var(--border);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 1.8rem; z-index: 50; box-shadow: var(--shadow-sm);
    }
    .header-title { font-size: 1rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 0.5rem; }
    .header-actions { display: flex; align-items: center; gap: 0.7rem; }
    .icon-btn {
        width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
        background: var(--card); color: var(--text-muted); display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: all 0.2s ease;
    }
    .icon-btn:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
    .icon-btn svg { width: 17px; height: 17px; }
    .live-pill {
        display: flex; align-items: center; gap: 0.5rem; background: var(--safe-light); color: var(--safe);
        border: 1px solid var(--safe-border); padding: 0.4rem 0.85rem; border-radius: 999px;
        font-size: 0.78rem; font-weight: 700;
    }

    /* ============ MAIN AREA ============ */
    main { margin-left: var(--sidebar-w); margin-top: var(--header-h); max-width: 1360px; padding: 2.2rem 2.4rem 4rem; animation: fadeIn 0.45s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(14px);} to { opacity: 1; transform: translateY(0);} }

    .page-title { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.6rem; color: var(--text); }
    .page-title .icon { width: 26px; height: 26px; color: var(--accent); }
    .page-subtitle { color: var(--text-muted); margin-bottom: 0.4rem; font-size: 0.95rem; display: flex; align-items: center; gap: 0.5rem; }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.4rem 1.5rem; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 1rem; opacity: 0; animation: fadeInUp 0.5s ease forwards; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .stat-card:nth-child(1) { animation-delay: 0.05s; } .stat-card:nth-child(2) { animation-delay: 0.14s; } .stat-card:nth-child(3) { animation-delay: 0.23s; }
    .stat-icon-wrap { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .stat-icon-wrap .icon { width: 22px; height: 22px; }
    .stat-icon-wrap.neutral { background: #eef2ff; color: #4338ca; }
    .stat-icon-wrap.danger { background: var(--danger-light); color: var(--danger); }
    .stat-icon-wrap.safe { background: var(--safe-light); color: var(--safe); }
    .stat-card .label { font-size: 0.76rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; margin-bottom: 0.25rem; }
    .stat-card .value { font-size: 1.8rem; font-weight: 800; color: var(--text); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .stat-card.danger .value { color: var(--danger); }
    .stat-card.safe .value { color: var(--safe); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.6rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm); opacity: 0; animation: fadeInUp 0.5s ease forwards; }
    .card:nth-of-type(1) { animation-delay: 0.1s; } .card:nth-of-type(2) { animation-delay: 0.2s; } .card:nth-of-type(3) { animation-delay: 0.3s; } .card:nth-of-type(4) { animation-delay: 0.4s; }
    .card h2 { font-size: 1.02rem; font-weight: 700; margin-bottom: 1.1rem; display: flex; align-items: center; gap: 0.55rem; color: var(--text); }
    .card h2 .icon { width: 19px; height: 19px; color: var(--accent); }
    .card-sub { color: var(--text-muted); font-size: 0.85rem; margin-top: -0.7rem; margin-bottom: 1.2rem; }

    .chart-row { display: grid; grid-template-columns: 1.5fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
    .chart-box { position: relative; height: 280px; }
    @media (max-width: 900px) { .chart-row { grid-template-columns: 1fr; } }

    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { text-align: left; padding: 0.65rem 0.85rem; background: rgba(128,128,128,0.06); color: var(--text-muted); font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.045em; border-bottom: 1px solid var(--border); }
    td { padding: 0.7rem 0.85rem; border-bottom: 1px solid var(--border); color: var(--text); }
    tbody tr { transition: background 0.15s ease; }
    tbody tr:hover td { background: rgba(128,128,128,0.05); }
    tbody tr:last-child td { border-bottom: none; }

    .badge { display: inline-flex; align-items: center; gap: 0.32rem; padding: 0.28rem 0.65rem; border-radius: 999px; font-size: 0.74rem; font-weight: 700; border: 1px solid transparent; }
    .badge .icon { width: 13px; height: 13px; }
    .badge.positive { background: var(--danger-light); color: var(--danger); border-color: var(--danger-border); }
    .badge.negative { background: var(--safe-light); color: var(--safe); border-color: var(--safe-border); }
    .badge.outbreak { background: var(--danger-light); color: var(--danger); border-color: var(--danger-border); animation: softPulse 2.2s infinite; }
    .badge.stable { background: var(--safe-light); color: var(--safe); border-color: var(--safe-border); }
    @keyframes softPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.25);} 50% { box-shadow: 0 0 0 5px rgba(220,38,38,0);} }

    .alert-banner { background: linear-gradient(90deg, #b91c1c, #dc2626 55%, #ef4444); color: white; padding: 1.05rem 1.5rem; border-radius: 14px; margin-bottom: 1.6rem; display: flex; align-items: center; gap: 0.9rem; font-weight: 600; font-size: 0.92rem; box-shadow: 0 8px 24px rgba(220,38,38,0.28); animation: slideDown 0.5s ease both, pulseGlow 2.4s ease-in-out infinite 0.5s; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px);} to { opacity: 1; transform: translateY(0);} }
    @keyframes pulseGlow { 0%,100% { box-shadow: 0 8px 24px rgba(220,38,38,0.28);} 50% { box-shadow: 0 8px 34px rgba(220,38,38,0.5);} }
    .alert-banner .icon { width: 22px; height: 22px; flex-shrink: 0; }

    .bar-row { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 0.85rem; }
    .bar-label { width: 170px; font-size: 0.83rem; font-weight: 600; color: var(--text); flex-shrink: 0; }
    .bar-track { flex: 1; background: rgba(128,128,128,0.12); border-radius: 7px; height: 22px; overflow: hidden; position: relative; }
    .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-2), var(--accent) 70%, #0e7490); border-radius: 7px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; color: white; font-size: 0.72rem; font-weight: 700; transition: width 1.1s cubic-bezier(.22,1,.36,1); }

    .live-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 0 rgba(34,197,94,0.5); animation: livePulse 1.8s infinite; }
    .refresh-note { font-size: 0.8rem; color: var(--text-faint); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.4rem; }
    .refresh-note .icon { width: 14px; height: 14px; }
    .refresh-track { height: 3px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 1.6rem; max-width: 260px; }
    .refresh-track .refresh-fill { height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 3px; }

    .region-pill { display: inline-flex; align-items: center; gap: 0.4rem; background: rgba(128,128,128,0.08); padding: 0.32rem 0.75rem; border-radius: 999px; font-size: 0.81rem; font-weight: 600; color: var(--text); border: 1px solid var(--border); }
    .region-pill .icon { width: 13px; height: 13px; color: var(--accent); }

    /* ============ ML EXPLAINED PAGE ============ */
    .step-card { display: flex; gap: 1rem; padding: 1.1rem 0; border-bottom: 1px solid var(--border); }
    .step-card:last-child { border-bottom: none; }
    .step-num { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }
    .step-body h4 { font-size: 0.92rem; margin-bottom: 0.3rem; color: var(--text); }
    .step-body p { font-size: 0.86rem; color: var(--text-muted); line-height: 1.5; }
    .feature-tag-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; }
    .feature-tag { background: rgba(8,145,178,0.1); color: var(--accent); border: 1px solid rgba(8,145,178,0.25); padding: 0.28rem 0.7rem; border-radius: 999px; font-size: 0.76rem; font-weight: 600; }
    .metric-explain-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .metric-explain-box { background: rgba(8,145,178,0.06); border: 1px solid rgba(8,145,178,0.15); border-radius: 12px; padding: 1rem; }
    .metric-explain-box .m-name { font-weight: 700; font-size: 0.85rem; color: var(--accent); margin-bottom: 0.3rem; }
    .metric-explain-box .m-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; }
    .model-tag { display: inline-block; background: var(--violet); color: white; font-size: 0.7rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 6px; margin-left: 0.5rem; text-transform: uppercase; letter-spacing: 0.04em; }

    /* ============ SETTINGS PAGE ============ */
    .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 0; border-bottom: 1px solid var(--border); }
    .settings-row:last-child { border-bottom: none; }
    .settings-label { font-weight: 600; font-size: 0.92rem; color: var(--text); }
    .settings-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }
    .toggle-switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: var(--border); border-radius: 999px; cursor: pointer; transition: 0.25s; }
    .toggle-slider::before { content: ""; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.25s; }
    .toggle-switch input:checked + .toggle-slider { background: var(--accent); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }
    .num-input { width: 90px; padding: 0.5rem 0.7rem; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font-size: 0.88rem; }
    .save-btn { background: var(--accent); color: white; border: none; padding: 0.7rem 1.4rem; border-radius: 10px; font-weight: 700; font-size: 0.88rem; cursor: pointer; transition: all 0.2s ease; }
    .save-btn:hover { background: var(--accent-2); transform: translateY(-1px); }
    .save-confirm { color: var(--safe); font-size: 0.85rem; font-weight: 600; margin-left: 0.8rem; opacity: 0; transition: opacity 0.3s ease; }
    .theme-options { display: flex; gap: 0.7rem; }
    .theme-option { border: 2px solid var(--border); border-radius: 10px; padding: 0.6rem 1rem; cursor: pointer; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; transition: all 0.2s ease; }
    .theme-option.selected { border-color: var(--accent); background: rgba(8,145,178,0.08); color: var(--accent); }

    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 8px; }
</style>
</head>
<body>
<aside class="sidebar">
    <div class="brand">
        <span class="brand-mark">
            <svg class="icon" viewBox="0 0 24 24" style="width:20px;height:20px;color:white;">
                <path d="M12 2c-1.5 2-2 4-2 6 0 2.2 1.8 4 4 4s4-1.8 4-4c0-2-.5-4-2-6"/>
                <path d="M12 12v9"/><path d="M8 16l-3-2"/><path d="M16 16l3-2"/>
                <path d="M8 20l-2 1"/><path d="M16 20l2 1"/>
                <circle cx="12" cy="6" r="1.4" fill="white" stroke="none"/>
            </svg>

    <nav class="side-nav">
        <span class="nav-section-label">Monitoring</span>


        <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
    <svg class="icon" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>

        </a>

            Settings
        </a>
    </nav>

    <div class="sidebar-status">
        <div class="status-row"><span><span class="status-dot"></span>Kafka Pipeline</span><span>Live</span></div>
        <div class="status-row"><span><span class="status-dot"></span>HDFS Storage</span><span>Live</span></div>
        <div class="status-row"><span><span class="status-dot"></span>MLlib Models</span><span>Live</span></div>
    </div>
</aside>

<header class="topbar">
    <div class="header-title">{% block header_title %}Dashboard{% endblock %}</div>
    <div class="header-actions">
        <span class="live-pill"><span class="live-dot"></span>System Online</span>
        <button class="icon-btn" id="themeToggleBtn" title="Toggle dark / light mode">
            <svg class="icon" id="themeIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<script>
    // ===== THEME (dark / light) =====
    (function() {
        var saved = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
        updateThemeIcon(saved);

        document.getElementById('themeToggleBtn').addEventListener('click', function() {
            var current = document.documentElement.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon(next);
        });

        function updateThemeIcon(mode) {
            var icon = document.getElementById('themeIcon');
            if (mode === 'dark') {
                icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>';
            } else {
                icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>';
            }
        }
    })();

    // ===== AUTO-REFRESH (configurable via Settings page) =====
    function initAutoRefresh(defaultSeconds) {
        var enabled = localStorage.getItem('refreshEnabled');
        enabled = enabled === null ? true : enabled === 'true';
        var seconds = parseInt(localStorage.getItem('refreshSeconds')) || defaultSeconds;

        var note = document.getElementById('autoRefreshNote');
        if (note) {
            note.textContent = enabled
                ? 'Auto-refreshing every ' + seconds + ' seconds'
                : 'Auto-refresh is turned off (change it in Settings)';
        }
        var track = document.getElementById('autoRefreshFill');
        if (track) {
            track.style.display = enabled ? 'block' : 'none';
            track.style.animation = enabled ? ('shrinkBar ' + seconds + 's linear forwards') : 'none';
        }

        if (enabled) {
            setTimeout(function() { window.location.reload(); }, seconds * 1000);
        }
    }
</script>
<style>
@keyframes shrinkBar { from { width: 100%; } to { width: 0%; } }
</style>
</body>
</html>
